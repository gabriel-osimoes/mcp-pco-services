services:
  - type: web
    name: pco-services-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Optional: Enable only after confirming the PAT belongs to the correct user
      # during real tool calls on oauth_test. Default is deliberately false.
      - key: MCP_STATELESS_HTTP
        value: "false"
